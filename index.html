<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kotoba Game — Ground Handling</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="topbar">
<button id="menuBtn" class="icon-btn" aria-label="Song bar">☰</button>
<b>ことば Game</b>
<button id="themeBtn" class="icon-btn" aria-label="Tema">☀️</button>
</header>
<aside id="songBar" class="song-bar">
<div class="song-head"><b>🎵 Song Bar</b><button id="closeSongBtn">×</button></div>
<audio id="audio" controls></audio><div id="playlist"></div>
</aside>
<main>
<section class="settings card">
<label>📚 Jumlah Soal
<select id="questionCount">
<option value="5">5 Soal</option><option value="10" selected>10 Soal</option>
<option value="20">20 Soal</option><option value="30">30 Soal</option>
<option value="50">50 Soal</option><option value="all">Semua Soal</option>
</select></label>
<button id="startBtn" class="primary">Mulai Ronde</button>
</section>
<section class="hud card">
<div>LEVEL<br><b id="level">1</b></div>
<div class="xp"><div><span>XP</span> <b id="xpText">0 / 100</b></div><div class="progress"><i id="xpBar"></i></div></div>
<div>🪙<br><b id="coins">0</b></div>
</section>
<section class="game card">
<small>SOAL <span id="round">0/10</span></small>
<h1 id="question">Pilih jumlah soal lalu mulai.</h1>
<div id="choices" class="choices"></div><p id="feedback"></p>
<button id="nextBtn" class="primary" hidden>Soal Berikutnya</button>
</section>
</main>
<div id="levelUp" class="modal" hidden><div class="levelup"><div>✨🎉✨</div><h2>LEVEL UP!</h2><p id="rewardText"></p><button id="levelUpClose" class="primary">Lanjut</button></div></div>
<div id="finish" class="modal" hidden><div class="levelup"><h2>🎉 Ronde Selesai!</h2><p id="finishText"></p><button id="finishClose" class="primary">Main Lagi</button></div></div>
<script src="js/music.js"></script><script src="js/theme.js"></script><script src="js/game.js"></script>
</body></html>
