<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ground Handling Kotoba Game</title>
<link rel="stylesheet" href="css/style.css">

<style>
.profile-card{margin:0 0 14px;padding:14px 16px;background:rgba(255,250,242,.92);border:1px solid #ead7c5;border-radius:18px;box-shadow:0 10px 25px rgba(91,70,54,.09);color:#5b4636}
.profile-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}
.level-badge{font-weight:900;letter-spacing:.4px}.level-badge b{font-size:18px}.xp-label{margin-left:8px;font-size:12px;opacity:.78}.coins{font-weight:800;font-size:13px}.xp-track{height:10px;border-radius:99px;background:#ead7c5;overflow:hidden}.xp-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#c78b67,#8fa58a);transition:width .45s ease}.profile-hint{font-size:11px;margin-top:6px;opacity:.72}
.level-up{position:fixed;inset:0;z-index:200000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(35,25,20,.28);backdrop-filter:blur(5px)}
.level-up-box{max-width:340px;width:100%;padding:26px 22px;text-align:center;background:#fffaf2;border:1px solid #ead7c5;border-radius:24px;box-shadow:0 20px 60px rgba(50,35,25,.25);animation:levelPop .35s ease}
.level-up-box .gift{font-size:48px}.level-up-box h2{margin:8px 0 4px}.level-up-box p{margin:5px 0 14px}.level-up-box button{padding:10px 20px;border:0;background:#c78b67;color:white;cursor:pointer}
@keyframes levelPop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
body.dark-mode .profile-card{background:rgba(35,34,47,.94);border-color:#4a4657;color:#eee8df}.dark-mode .xp-track{background:#4a4657}.dark-mode .level-up-box{background:#23222f;color:#eee8df;border-color:#4a4657}
</style>

</head>
<body>

<div class="wrap">
  <div class="top"><div class="brand">✈️ Ground Handling <span>Kotoba Game</span></div><div class="pill">🇯🇵 日本語 × 🇮🇩 Indonesia</div></div>
  <div class="profile-card">
    <div class="profile-top">
      <div><span class="level-badge">LEVEL <b id="level">1</b></span><span class="xp-label" id="xpLabel">0 / 100 XP</span></div>
      <div class="coins" id="coins">🪙 0</div>
    </div>
    <div class="xp-track"><div class="xp-fill" id="xpBar"></div></div>
    <div class="profile-hint" id="levelHint">100 XP lagi menuju Level 2</div>
  </div>
  <div class="card" id="game">
    <div class="stats">
      <div class="stat"><b id="score">0</b><small>Skor</small></div>
      <div class="stat"><b id="streak">0</b><small>Streak</small></div>
      <div class="stat"><b id="qnum">1</b><small>Soal</small></div>
      <div class="stat"><b id="timer">15</b><small>Detik</small></div>
    </div>
    <div class="controls">
      <div class="control"><label>Bagian</label><select id="part"><option value="ALL">Semua Part</option><option>PART 2</option><option>PART 3</option><option>PART 4</option></select></div>
      <div class="control"><label>Mode</label><select id="mode"><option value="jp-id">Jepang → pilih arti</option><option value="id-jp">Indonesia → pilih kotoba Jepang</option></select></div>
    </div>
    <div class="question">
      <div class="label" id="label">Apa arti kotoba ini?</div>
      <div class="word" id="word">---</div>
      <div class="hint" id="hint">Pilih jawaban yang benar.</div>
      <div class="answers" id="answers"></div>
      <button class="next" id="next" disabled>Soal berikutnya →</button>
      <div class="progress"><div class="bar" id="bar"></div></div>
    </div>
    <div class="footer"><span id="source">Sumber: PART 2–4 Ground Handling</span><span>hingga 50 soal per ronde</span></div>
  </div>
  <div class="card" id="result">
    <div class="label">RONDE SELESAI 🎉</div>
    <div class="bigscore" id="finalScore">0</div>
    <p id="finalText"></p>
    <button class="restart" onclick="startGame()">Main Lagi</button>
  </div>
</div>




<style>
:root{
  --cozy-bg:#f7efe3;--cozy-card:#fffaf2;--cozy-text:#5b4636;--cozy-accent:#c78b67;
  --cozy-soft:#ead7c5;--cozy-green:#8fa58a;
}
body{
  background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.75),transparent 28%),
    radial-gradient(circle at 85% 10%,rgba(234,215,197,.55),transparent 30%),
    linear-gradient(135deg,var(--cozy-bg),#f3e4d4)!important;
  color:var(--cozy-text)!important;
}
.card,.panel,.game-card,.question-card,.modal{
  background:rgba(255,250,242,.92)!important;
  border-color:var(--cozy-soft)!important;
  box-shadow:0 12px 30px rgba(91,70,54,.10)!important;
}
button{
  border-radius:14px!important;
}
#cozyMusic{
  position:fixed;left:78px;top:16px;z-index:99999;width:260px;padding:12px 14px;
  background:rgba(255,250,242,.96);border:1px solid var(--cozy-soft);border-radius:18px;
  box-shadow:0 10px 28px rgba(91,70,54,.16);font-family:inherit;color:var(--cozy-text);
  backdrop-filter:blur(8px)
}
.musicTitle{font-weight:800;font-size:13px;margin-bottom:7px}
.musicRow{display:flex;gap:6px;align-items:center}
.musicRow button{padding:7px 9px;border:1px solid var(--cozy-soft);background:#fff;color:var(--cozy-text);cursor:pointer}
#trackName{margin-top:7px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8}
</style>


<style>
#themeToggle{
  position:fixed;right:14px;bottom:145px;z-index:100000;
  width:48px;height:48px;border-radius:50%!important;border:1px solid #ead7c5;
  background:#fffaf2;color:#5b4636;font-size:22px;cursor:pointer;
  box-shadow:0 8px 22px rgba(91,70,54,.16);
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s,background .2s;
}
#themeToggle:hover{transform:scale(1.08)}

body.dark-mode{
  background:
    radial-gradient(circle at 15% 15%,rgba(80,70,95,.32),transparent 28%),
    radial-gradient(circle at 85% 10%,rgba(48,55,80,.35),transparent 30%),
    linear-gradient(135deg,#171722,#252334)!important;
  color:#eee8df!important;
}
body.dark-mode .card,
body.dark-mode .panel,
body.dark-mode .game-card,
body.dark-mode .question-card,
body.dark-mode .modal{
  background:rgba(35,34,47,.94)!important;
  border-color:#4a4657!important;
  color:#eee8df!important;
  box-shadow:0 12px 30px rgba(0,0,0,.28)!important;
}
body.dark-mode button{
  color:#eee8df;
}
body.dark-mode #cozyMusic{
  background:rgba(35,34,47,.96);
  border-color:#4a4657;
  color:#eee8df;
}
body.dark-mode .musicRow button{
  background:#2b2938;
  border-color:#4a4657;
  color:#eee8df;
}
body.dark-mode #themeToggle{
  background:#2b2938;color:#ffe8a3;border-color:#4a4657;
}
@media(max-width:600px){
  #themeToggle{bottom:135px;right:12px;width:44px;height:44px}
  #musicBurger{left:12px;top:12px;width:46px;height:46px}
}

#musicBurger{
  position:fixed;left:16px;top:16px;z-index:100000;
  width:50px;height:50px;border-radius:15px!important;
  border:1px solid var(--cozy-soft,#ead7c5);
  background:#fffaf2;color:#5b4636;cursor:pointer;
  box-shadow:0 8px 22px rgba(91,70,54,.16);
  display:none;align-items:center;justify-content:center;
  transition:transform .25s ease,box-shadow .25s ease;
  animation:burgerFloat 3s ease-in-out infinite;
}
#musicBurger:hover{
  transform:scale(1.08) rotate(-2deg);
  box-shadow:0 12px 28px rgba(91,70,54,.22);
}
#musicBurger .burgerIcon{
  width:25px;height:18px;display:flex;flex-direction:column;
  justify-content:space-between;
}
#musicBurger .burgerIcon span{
  display:block;height:3px;border-radius:4px;background:currentColor;
  transition:transform .25s ease,opacity .2s ease,width .25s ease;
}
#musicBurger:hover .burgerIcon span:nth-child(1){width:19px}
#musicBurger:hover .burgerIcon span:nth-child(3){width:19px;margin-left:6px}
@keyframes burgerFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
#cozyMusic.collapsed{display:none!important}
#musicHide{
  float:right;border:0!important;background:transparent!important;
  color:inherit;font-size:16px;cursor:pointer;padding:0 3px;
}
body.dark-mode #musicBurger{
  background:#2b2938;color:#eee8df;border-color:#4a4657;
}

/* Song bar rolling/sliding animation */
#cozyMusic{
  transform-origin: top left;
  animation-duration:.38s;
  animation-timing-function:cubic-bezier(.22,.8,.25,1);
  animation-fill-mode:both;
}
#cozyMusic.music-opening{
  animation-name:musicRollOpen;
}
#cozyMusic.music-closing{
  animation-name:musicRollClose;
}
@keyframes musicRollOpen{
  0%{opacity:0;transform:translateX(-45px) scaleX(.35) scaleY(.82) rotate(-2deg);transform-origin:left center}
  55%{opacity:1;transform:translateX(8px) scaleX(1.04) scaleY(1.02) rotate(1deg);transform-origin:left center}
  100%{opacity:1;transform:translateX(0) scaleX(1) scaleY(1) rotate(0);transform-origin:left center}
}
@keyframes musicRollClose{
  0%{opacity:1;transform:translateX(0) scaleX(1) scaleY(1) rotate(0);transform-origin:left center}
  100%{opacity:0;transform:translateX(-45px) scaleX(.35) scaleY(.82) rotate(-2deg);transform-origin:left center}
}
</style>


<script src="js/game.js"></script>
<script src="js/music.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
